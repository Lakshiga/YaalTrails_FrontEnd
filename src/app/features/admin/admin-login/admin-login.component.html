<div class="row justify-content-center">
  <div class="col-md-5">
    <h1 class="h4 mb-4">Administrator Login</h1>

    <form (ngSubmit)="submit()">
      <div class="mb-3">
        <label class="form-label" for="username">Username</label>
        <input id="username" name="username" class="form-control" [(ngModel)]="username" required autocomplete="username" />
      </div>

      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input id="password" name="password" type="password" class="form-control" [(ngModel)]="password" required autocomplete="current-password" />
      </div>

      @if (errorMessage()) {
        <div class="alert alert-danger py-2">{{ errorMessage() }}</div>
      }

      <button type="submit" class="btn btn-primary w-100" [disabled]="loading()">
        {{ loading() ? 'Logging in…' : 'Login' }}
      </button>
    </form>
  </div>
</div>
